<style>
/* ━━━━━━━━━━━━━━━ TOKENS ━━━━━━━━━━━━━━━ */
:root {
  --bg:      #0a0e14;
  --gold:    #ff9c1a;
  --gold2:   #ffc266;
  --text:    rgba(255,255,255,0.94);
  --muted:   rgba(255,255,255,0.65);
  --muted2:  rgba(255,255,255,0.42);
  --line:    rgba(255,255,255,0.09);
  --success: #00d18f;
  --nav-h:   60px;
  --r:       18px;
  --r2:      24px;
}

/* ━━━━━━━━━━━━━━━ RESET ━━━━━━━━━━━━━━━ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible {
  outline: 2px solid rgba(255,156,26,.9); outline-offset: 3px; border-radius: 6px;
}

/* ━━━━━━━━━━━━━━━ SCROLL WRAP ━━━━━━━━━━━━━━━ */
#wrap {
  height: 100dvh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#wrap::-webkit-scrollbar { display: none; }

/* ━━━━━━━━━━━━━━━ SLIDE BASE ━━━━━━━━━━━━━━━ */
.slide {
  height: 100dvh;
  scroll-snap-align: start;
  display: flex;
  /* NOT align-items:center — see the margin-block rule below */
  align-items: flex-start;
  justify-content: center;
  position: relative;
  overflow-x: hidden;
  overflow-y: auto;
  /* top padding clears fixed nav */
  padding: calc(var(--nav-h) + clamp(16px,3vw,32px)) clamp(18px,5vw,64px) clamp(20px,3vw,36px);
}

/* Centre the content when it fits, let it start at the top when it doesn't.
   With align-items:center a flex item taller than the slide has its overflow
   split above and below — and the part above the start edge is unreachable by
   scrolling, so on short phones (iPhone X ≈ 635px of usable height) the
   headings were simply cut off with no way to see them. Auto block margins
   centre exactly like align-items:center while there is free space, then
   collapse to 0 once the content overflows, which keeps the top reachable.
   .scroll-cue is position:absolute so this does not affect it. */
.slide > *:not(.deco) { margin-block: auto; }

/* ━━━━━━━━━━━━━━━ AMBIENT BLOBS ━━━━━━━━━━━━━━━ */
/* Decoration layer. The blobs bleed past the slide edge on purpose, and
   blobFloat scales them further out — but an absolutely positioned descendant
   still counts toward its scroll container's scrollable area. On the slides
   that opt into overflow-y:auto (.s6 .s7 .s12 .s14) that bleed showed up as a
   scrollbar with nothing to scroll to: measured content overflow on every
   slide is 0px, while the blob alone added 34–177px, growing with viewport
   height (it is a percentage offset). Clipping the blobs in their own layer
   keeps the look identical and leaves slide scroll height driven by content. */
.deco {
  position: absolute; inset: 0;
  overflow: hidden; pointer-events: none;
}
.blob {
  position: absolute; border-radius: 50%;
  filter: blur(88px); pointer-events: none;
  animation: blobFloat 10s ease-in-out infinite;
}
@keyframes blobFloat {
  0%,100% { opacity:.28; transform: scale(1)    translate(0,0); }
  50%      { opacity:.48; transform: scale(1.2)  translate(-3%,6%); }
}

/* ━━━━━━━━━━━━━━━ INNER CONTENT ━━━━━━━━━━━━━━━ */
.s-inner {
  position: relative; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center; gap: 12px;
  text-align: center; max-width: 840px; width: 100%;
}
.s-inner.s-left { align-items: flex-start; text-align: left; }

/* ━━━━━━━━━━━━━━━ REVEAL ANIMATIONS ━━━━━━━━━━━━━━━ */
.reveal {
  opacity: 0; transform: translateY(20px);
  transition: opacity .65s cubic-bezier(.16,1,.3,1),
              transform .65s cubic-bezier(.16,1,.3,1);
}
.reveal.in { opacity: 1; transform: none; }

/* stagger helpers */
.d1 { transition-delay:.06s; }
.d2 { transition-delay:.14s; }
.d3 { transition-delay:.22s; }
.d4 { transition-delay:.30s; }
.d5 { transition-delay:.38s; }
.d6 { transition-delay:.46s; }
.d7 { transition-delay:.54s; }

/* ━━━━━━━━━━━━━━━ TYPE ━━━━━━━━━━━━━━━ */
.eyebrow {
  font-size: 11px; font-weight: 900; letter-spacing: .22em;
  text-transform: uppercase; color: var(--muted2);
}
.headline {
  font-size: clamp(26px, 5vw, 54px);
  font-weight: 900; letter-spacing: -.025em; line-height: 1.04;
}
.sub {
  font-size: clamp(15px, 1.8vw, 18px);
  line-height: 1.65; color: var(--muted); max-width: 56ch;
}
.bignum {
  font-size: clamp(76px, 17vw, 172px);
  font-weight: 900; line-height: .84; letter-spacing: -.045em;
  display: inline-block;
}
.gold-text {
  background: linear-gradient(90deg, var(--gold) 0%, var(--gold2) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.slide-note {
  font-size: 12px; color: var(--muted2); line-height: 1.55; max-width: 58ch;
}

/* ━━━━━━━━━━━━━━━ BUTTONS ━━━━━━━━━━━━━━━ */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 20px; border-radius: 14px;
  font-weight: 700; font-size: 14px;
  border: 1px solid rgba(255,255,255,.13);
  background: rgba(255,255,255,.06); color: var(--text);
  cursor: pointer; white-space: nowrap; user-select: none;
  transition: transform .13s ease, background .13s ease,
              border-color .13s ease, box-shadow .13s ease;
}
.btn:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,.10);
  border-color: rgba(255,255,255,.22);
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
.btn-gold {
  border-color: rgba(255,156,26,.5);
  background: linear-gradient(180deg, rgba(255,156,26,.3) 0%, rgba(255,156,26,.14) 100%);
}
.btn-gold:hover {
  border-color: rgba(255,156,26,.82);
  box-shadow: 0 10px 28px rgba(255,156,26,.2);
}
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* ━━━━━━━━━━━━━━━ PILL / CHIP ━━━━━━━━━━━━━━━ */
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid rgba(255,156,26,.38);
  background: rgba(255,156,26,.1);
  color: rgba(255,255,255,.9);
  font-size: 14px; font-weight: 750;
}
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: rgba(255,255,255,.04);
  color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .02em;
}
.chip-gold {
  border-color: rgba(255,156,26,.3); background: rgba(255,156,26,.07);
}
.chip strong { color: var(--gold); margin-right: 3px; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* ━━━━━━━━━━━━━━━ HERO LAYOUT ━━━━━━━━━━━━━━━ */
.hero-grid {
  display: grid; grid-template-columns: 1.1fr .9fr;
  gap: 28px; align-items: center;
  position: relative; z-index: 2;
  max-width: 1080px; width: 100%;
}
.hero-left { text-align: left; }
.hero-left .eyebrow { margin-bottom: 4px; }
.hero-left .headline { margin: 10px 0 14px; }
.hero-left .sub { margin-bottom: 16px; }
.hero-left .btn-row { justify-content: flex-start; }
.trust-strip {
  display: flex; align-items: center; gap: 8px;
  margin-top: 12px; color: var(--muted2);
  font-size: 13px; font-weight: 700;
}
.trust-dot {
  width: 7px; height: 7px; border-radius: 999px;
  background: var(--gold); box-shadow: 0 0 18px rgba(255,156,26,.5);
  flex-shrink: 0;
}
.hero-right {
  border-radius: var(--r2); overflow: hidden; position: relative;
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 24px 64px rgba(0,0,0,.55),
              0 0 0 1px rgba(255,156,26,.08);
  animation: heroGlow 7s ease-in-out infinite;
}
@keyframes heroGlow {
  0%,100% { box-shadow: 0 24px 64px rgba(0,0,0,.55), 0 0 0 1px rgba(255,156,26,.08); }
  50%      { box-shadow: 0 24px 64px rgba(0,0,0,.55), 0 0 0 1px rgba(255,156,26,.22),
                         0 0 60px rgba(255,156,26,.06); }
}
.hero-cover {
  display: block; width: 100%; height: 340px;
  object-fit: cover; object-position: center;
  filter: saturate(1.05);
}
.hero-overlay {
  position: absolute; inset: 0;
  background:
    radial-gradient(600px 300px at 70% 15%, rgba(255,156,26,.22), transparent 55%),
    linear-gradient(180deg, rgba(7,10,18,.08) 0%, rgba(7,10,18,.75) 65%, rgba(7,10,18,.95) 100%);
}
.hero-metrics {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 16px;
}
.metrics-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.metric-box {
  padding: 12px 10px; border-radius: 14px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.07); text-align: center;
  backdrop-filter: blur(8px);
}
.metric-k { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted2); }
.metric-v {
  margin-top: 5px; font-size: 20px; font-weight: 900; letter-spacing: -.025em;
  background: linear-gradient(90deg, var(--gold), var(--gold2));
  -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.1;
}
.metrics-foot { margin-top: 8px; font-size: 10px; color: var(--muted2); font-weight: 700; text-align: center; }

/* ━━━━━━━━━━━━━━━ STAT CARDS ━━━━━━━━━━━━━━━ */
.stat-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; }
.stat-box {
  flex: 1 1 130px; max-width: 195px;
  border: 1px solid rgba(255,156,26,.22); border-radius: var(--r);
  padding: 20px 14px; text-align: center;
  background: radial-gradient(110px 60px at 50% 0%, rgba(255,156,26,.17), transparent 70%),
              rgba(255,255,255,.03);
  transition: border-color .2s, transform .2s, box-shadow .2s;
}
.stat-box:hover {
  border-color: rgba(255,156,26,.45);
  transform: translateY(-3px);
  box-shadow: 0 16px 40px rgba(0,0,0,.3);
}
.stat-num {
  display: block; font-size: clamp(26px,4vw,42px); font-weight: 900;
  letter-spacing: -.03em; line-height: 1;
}
.stat-lbl { margin-top: 8px; font-size: 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted2); }
.stat-sub { margin-top: 3px; font-size: 12px; color: var(--muted2); }

/* ━━━━━━━━━━━━━━━ STEP CARDS ━━━━━━━━━━━━━━━ */
.steps-grid {
  display: grid; grid-template-columns: repeat(2,1fr);
  gap: 12px; width: 100%; max-width: 780px;
}
.step-card {
  padding: 20px 18px; border-radius: var(--r);
  border: 1px solid var(--line); background: rgba(255,255,255,.04);
  text-align: left;
  transition: border-color .2s, background .2s, transform .2s;
}
.step-card:hover {
  border-color: rgba(255,156,26,.28); background: rgba(255,156,26,.04);
  transform: translateY(-2px);
}
.step-n { font-size: 11px; font-weight: 900; letter-spacing: .12em; color: var(--gold); }
.step-t { margin-top: 8px; font-weight: 850; font-size: 15px; line-height: 1.3; }
.step-d { margin-top: 6px; font-size: 14px; color: var(--muted); line-height: 1.58; }

/* ━━━━━━━━━━━━━━━ FEATURE CARDS ━━━━━━━━━━━━━━━ */
.feat-grid {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 12px; width: 100%;
}
.feat-card {
  padding: 20px 16px; border-radius: var(--r);
  border: 1px solid var(--line); background: rgba(255,255,255,.04);
  text-align: left;
  transition: border-color .2s, background .2s, transform .2s;
}
.feat-card:hover {
  border-color: rgba(255,156,26,.25); background: rgba(255,156,26,.04);
  transform: translateY(-2px);
}
.feat-icon {
  font-size: 18px; width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,.12);
  background: radial-gradient(20px 20px at 30% 30%, rgba(255,156,26,.32), rgba(10,14,20,.5));
  margin-bottom: 12px;
}
.feat-h { font-weight: 850; font-size: 15px; margin-bottom: 6px; line-height: 1.3; }
.feat-p { font-size: 13px; color: var(--muted); line-height: 1.58; }

/* ━━━━━━━━━━━━━━━ REVIEW CARDS ━━━━━━━━━━━━━━━ */
.review-grid {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 10px; width: 100%;
}
.review-card {
  padding: 16px 14px; border-radius: var(--r);
  border: 1px solid var(--line); background: rgba(255,255,255,.04);
  text-align: left; display: flex; flex-direction: column;
}
.stars { color: var(--gold); font-size: 11px; letter-spacing: .12em; margin-bottom: 10px; }
.review-q { font-size: 14px; line-height: 1.62; color: var(--text); flex: 1; }
.review-who { margin-top: 12px; display: flex; align-items: center; gap: 9px; }
.avatar {
  width: 32px; height: 32px; border-radius: 999px; flex-shrink: 0;
  display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,.16);
  background: linear-gradient(135deg, rgba(255,156,26,.32), rgba(31,41,55,.45));
  font-size: 10px; font-weight: 900; letter-spacing: .02em;
}
.who-name { font-size: 12px; font-weight: 760; color: var(--muted2); }
.verified { font-size: 11px; color: rgba(140,220,160,.88); font-weight: 800; }
.verified::before { content: '✓ '; }

/* ━━━━━━━━━━━━━━━ PRICING SLIDE ━━━━━━━━━━━━━━━ */
.pricing-wrap {
  display: grid; grid-template-columns: 1fr auto;
  gap: 36px; align-items: center;
  max-width: 880px; width: 100%;
  position: relative; z-index: 2;
}
.pricing-left { text-align: left; }
.pricing-left .headline { margin: 10px 0 12px; }
.pricing-left .sub { margin-bottom: 16px; }
.plan-card {
  position: relative;
  border: 1px solid rgba(255,156,26,.45); border-radius: 26px;
  padding: 28px 24px; width: 360px;
  background: radial-gradient(500px 180px at 50% 0%, rgba(255,156,26,.14), transparent 60%),
              rgba(255,255,255,.04);
  box-shadow: 0 24px 64px rgba(0,0,0,.5);
  flex-shrink: 0;
}
.plan-badge {
  position: absolute; top: -12px; right: 20px;
  padding: 5px 13px; border-radius: 999px;
  border: 1px solid rgba(255,156,26,.62);
  background: linear-gradient(90deg, var(--gold), var(--gold2));
  color: #1a0f00; font-size: 11px; font-weight: 900;
  letter-spacing: .08em; text-transform: uppercase;
}
.plan-name { font-size: 11px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--muted2); }
.plan-head { font-size: 19px; font-weight: 850; margin: 8px 0 12px; }
.plan-price { display: flex; align-items: baseline; gap: 6px; margin-bottom: 16px; }
.plan-price .num {
  font-size: 52px; font-weight: 900; letter-spacing: -.045em; line-height: 1;
  background: linear-gradient(90deg, var(--gold), var(--gold2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.plan-price .per { color: var(--muted); font-size: 14px; font-weight: 700; }
.plan-feats { list-style: none; display: grid; gap: 8px; margin-bottom: 18px; }
.plan-feats li {
  display: flex; align-items: flex-start; gap: 8px;
  font-size: 13px; line-height: 1.42; color: var(--text);
}
.plan-feats li::before {
  content: '✓'; flex-shrink: 0; width: 18px; height: 18px;
  display: inline-grid; place-items: center; border-radius: 999px;
  background: rgba(255,156,26,.18); color: var(--gold);
  font-size: 11px; font-weight: 900; margin-top: 1px;
}
.plan-meta { margin-top: 10px; font-size: 12px; color: var(--muted2); line-height: 1.5; }

/* PAYMENT */
.payment-wrap {
  display: grid; grid-template-columns: .95fr 1.05fr;
  gap: 18px; align-items: center;
  max-width: 980px; width: 100%;
  position: relative; z-index: 2;
}
.payment-copy { text-align: left; }
.payment-copy .headline { margin: 10px 0 12px; }
.payment-copy .sub { margin-bottom: 14px; }
.payment-card {
  border: 1px solid rgba(255,156,26,.38); border-radius: 24px;
  padding: 20px; text-align: left;
  background: radial-gradient(520px 180px at 50% 0%, rgba(255,156,26,.14), transparent 62%),
              rgba(255,255,255,.045);
  box-shadow: 0 24px 64px rgba(0,0,0,.46);
}
.payment-top { display: grid; grid-template-columns: 124px 1fr; gap: 16px; align-items: center; }
.payment-qr {
  width: 124px; height: 124px; object-fit: contain; border-radius: 14px;
  border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04);
}
.wallet-label {
  font-size: 11px; font-weight: 900; letter-spacing: .08em;
  color: var(--muted2); text-transform: uppercase; margin-bottom: 7px;
}
.wallet-code {
  display: block; width: 100%; padding: 10px 12px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.22);
  font-size: 13px; color: var(--text); word-break: break-all;
}
.payment-warning {
  margin-top: 12px; padding: 11px 13px; border-radius: 14px;
  border: 1px solid rgba(255,156,26,.28); background: rgba(255,156,26,.07);
  color: var(--muted); font-size: 13px; line-height: 1.55;
}
.payment-after {
  margin-top: 14px; padding: 14px; border-radius: 16px;
  border: 1px solid rgba(255,255,255,.11); background: rgba(255,255,255,.04);
}
.payment-after h3 { font-size: 14px; margin-bottom: 8px; }
.payment-after p { color: var(--muted); font-size: 13px; line-height: 1.62; }
.payment-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 12px; }
.payment-actions .btn { font-size: 13px; }

/* ━━━━━━━━━━━━━━━ SUPPORT ━━━━━━━━━━━━━━━ */
.support-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 14px; width: 100%; max-width: 780px;
}
.support-box {
  padding: 22px 20px; border-radius: var(--r);
  border: 1px solid var(--line); background: rgba(255,255,255,.04); text-align: left;
}
.support-box h3 { font-size: 16px; font-weight: 850; margin-bottom: 12px; }
.link-list { display: grid; gap: 9px; }
.link-list a {
  color: rgba(255,255,255,.82); text-decoration: underline;
  text-underline-offset: 3px; font-size: 14px; line-height: 1.5;
  transition: color .14s;
}
.link-list a:hover { color: #fff; }
.warn-box {
  margin-top: 12px; padding: 12px 14px; border-radius: 14px;
  border: 1px solid rgba(255,156,26,.28); background: rgba(255,156,26,.07);
  font-size: 13px; line-height: 1.58; color: var(--muted);
}
.support-actions { display: grid; gap: 9px; margin-top: 14px; }
.policy-list { list-style: none; display: grid; gap: 8px; margin-top: 12px; }
.policy-list li {
  display: flex; align-items: flex-start; gap: 8px;
  color: var(--muted); font-size: 13px; line-height: 1.5;
}
.policy-list li::before {
  content: '✓'; flex-shrink: 0; width: 17px; height: 17px;
  display: inline-grid; place-items: center; border-radius: 999px;
  background: rgba(255,156,26,.15); color: var(--gold);
  font-size: 10px; font-weight: 900; margin-top: 1px;
}
.foot-note { margin-top: 14px; font-size: 12px; color: var(--muted2); line-height: 1.55; }
.foot-note a { color: var(--muted2); text-decoration: underline; text-underline-offset: 2px; }

/* ━━━━━━━━━━━━━━━ VIDEO (DEMO) ━━━━━━━━━━━━━━━ */
.video-card {
  position: relative; width: 100%; max-width: 760px;
  border-radius: var(--r2); overflow: hidden; padding: 12px;
  border: 1px solid rgba(255,255,255,.13);
  background: radial-gradient(700px 280px at 50% 0%, rgba(255,156,26,.12), transparent 60%),
              rgba(255,255,255,.04);
  box-shadow: 0 24px 60px rgba(0,0,0,.45);
}
.video-card video {
  width: 100%; display: block; border-radius: 16px;
  border: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,.3);
  max-height: 52vh;
}
.video-play {
  position: absolute; inset: 12px; border: 0; border-radius: 16px;
  background: linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.5) 100%);
  color: var(--text); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; font-weight: 800; font-size: 13px; letter-spacing: .04em;
  transition: opacity .2s, background .2s;
}
.video-play .play-circle {
  width: 64px; height: 64px; border-radius: 999px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: #1a0f00; font-size: 24px; line-height: 1;
  box-shadow: 0 16px 40px rgba(255,156,26,.32);
}
.video-card.playing .video-play { opacity: 0; pointer-events: none; }

/* ━━━━━━━━━━━━━━━ DEMO TAB PANES ━━━━━━━━━━━━━━━ */
/* Video and chart examples used to be two slides. They answer the same
   question ("show me it working"), so they share one slide behind a tab —
   only one pane is in flow at a time, which keeps the slide one viewport tall. */
.demo-pane {
  display: none; width: 100%;
  flex-direction: column; align-items: center; gap: 14px;
}
.demo-pane.act { display: flex; }

/* ━━━━━━━━━━━━━━━ EXAMPLES GALLERY ━━━━━━━━━━━━━━━ */
.gallery {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 12px; width: 100%; max-width: 900px;
}
.shot {
  position: relative; border-radius: var(--r); overflow: hidden;
  border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04);
  cursor: zoom-in; box-shadow: 0 16px 40px rgba(0,0,0,.25);
  transition: transform .2s, border-color .2s;
}
.shot:hover { transform: translateY(-3px); border-color: rgba(255,156,26,.32); }
.shot img { width: 100%; height: auto; display: block; aspect-ratio: 2/1; object-fit: cover; }
.shot .cap {
  position: absolute; left: 10px; right: 10px; bottom: 10px;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; pointer-events: none;
}
.shot .cap-label {
  padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 850;
  border: 1px solid rgba(255,255,255,.14); background: rgba(7,10,18,.66);
  backdrop-filter: blur(8px); color: #fff;
}
.shot .cap-note { font-size: 10px; color: rgba(255,255,255,.78); font-weight: 700; text-align: right; line-height: 1.25; text-shadow: 0 6px 18px rgba(0,0,0,.4); }

/* ━━━━━━━━━━━━━━━ FIT CHECK ━━━━━━━━━━━━━━━ */
.fit-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 14px; width: 100%; max-width: 720px;
}
.fit-box {
  padding: 22px 20px; border-radius: var(--r);
  border: 1px solid var(--line); background: rgba(255,255,255,.04); text-align: left;
}
.fit-box.good { border-color: rgba(0,209,143,.28); background: rgba(0,209,143,.05); }
.fit-box.bad  { border-color: rgba(246,70,93,.22); background: rgba(246,70,93,.04); }
.fit-box h3 { font-size: 15px; font-weight: 850; margin-bottom: 12px; }
.fit-list { list-style: none; display: grid; gap: 9px; }
.fit-list li { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; line-height: 1.5; color: var(--text); }
.fit-list li::before {
  content: '✓'; flex-shrink: 0; width: 18px; height: 18px;
  display: inline-grid; place-items: center; border-radius: 999px;
  font-size: 11px; font-weight: 900; margin-top: 1px;
  background: rgba(0,209,143,.18); color: var(--success);
}
.fit-box.bad .fit-list li::before { content: '×'; background: rgba(246,70,93,.16); color: var(--danger); }

/* ━━━━━━━━━━━━━━━ INTEGRITY ━━━━━━━━━━━━━━━ */
.int-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 720px; }
.int-box {
  padding: 22px 20px; border-radius: var(--r);
  border: 1px solid var(--line); background: rgba(255,255,255,.04); text-align: left;
}
.int-box h3 { font-size: 15px; font-weight: 850; margin-bottom: 8px; color: var(--gold); }
.int-box p { font-size: 14px; color: var(--muted); line-height: 1.62; }

/* ━━━━━━━━━━━━━━━ FAQ ━━━━━━━━━━━━━━━ */
.faq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 820px; text-align: left; }
.faq-grid {
  /* Shares the slide with the folded-in integrity block, so the scroll
     window is shorter than when FAQ owned the whole viewport. */
  max-height: min(44vh, 420px);
  overflow: auto;
  padding-right: 4px;
  scrollbar-width: thin;
}
/* Integrity block, folded into the FAQ slide */
.faq-int { width: 100%; max-width: 820px; }
.int-tag {
  font-size: 10px; font-weight: 900; letter-spacing: .2em;
  text-transform: uppercase; color: var(--gold);
  text-align: left; margin-bottom: 7px;
}
.faq-int .int-grid { max-width: none; gap: 10px; }
.faq-int .int-box { padding: 13px 15px; }
.faq-int .int-box h3 { font-size: 13px; margin-bottom: 5px; }
.faq-int .int-box p { font-size: 12.5px; line-height: 1.55; }
.faq-item {
  border: 1px solid var(--line); border-radius: 14px;
  background: rgba(255,255,255,.04); padding: 13px 15px;
  transition: border-color .2s, background .2s;
}
.faq-item[open] { border-color: rgba(255,156,26,.3); background: rgba(255,156,26,.05); }
.faq-item summary {
  cursor: pointer; font-weight: 780; font-size: 14px; line-height: 1.45;
  list-style: none; display: flex; justify-content: space-between; gap: 10px;
}
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::after { content: '+'; color: var(--gold); font-weight: 900; flex-shrink: 0; }
.faq-item[open] summary::after { content: '−'; }
.faq-item p { margin-top: 9px; font-size: 13px; color: var(--muted); line-height: 1.62; }

/* ━━━━━━━━━━━━━━━ GUIDES ━━━━━━━━━━━━━━━ */
.guides-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; width: 100%; max-width: 860px; }
.guide-card {
  padding: 22px 18px; border-radius: var(--r);
  border: 1px solid var(--line); background: rgba(255,255,255,.04);
  text-align: left; display: flex; flex-direction: column;
  transition: border-color .2s, transform .2s;
}
.guide-card:hover { border-color: rgba(255,156,26,.3); transform: translateY(-3px); }
.guide-icon { font-size: 26px; margin-bottom: 10px; }
.guide-h { font-weight: 850; font-size: 15px; margin-bottom: 8px; line-height: 1.3; }
.guide-p { font-size: 13px; color: var(--muted); line-height: 1.58; flex: 1; margin-bottom: 14px; }

/* the course library spans the full row: it holds more than the three
   single-guide cards and should read as the entry point, not a peer */
.guide-card.guide-feature {
  grid-column: 1 / -1;
  flex-direction: row; align-items: center; gap: 18px;
  padding: 18px; border-color: rgba(255,156,26,.28);
  background: linear-gradient(100deg, rgba(255,156,26,.09), rgba(255,255,255,.03));
}
.guide-feature .guide-icon { margin: 0; font-size: 30px; flex: none; }
.guide-feature .gf-copy { flex: 1; min-width: 0; }
.guide-feature .guide-h { margin-bottom: 4px; }
.guide-feature .guide-p { margin-bottom: 0; }
.guide-feature .btn { flex: none; }
@media (max-width: 760px) {
  .guide-card.guide-feature { flex-direction: column; align-items: stretch; text-align: left; }
  .guide-feature .btn { justify-content: center; }
}

/* ━━━━━━━━━━━━━━━ SLIDE BACKGROUNDS ━━━━━━━━━━━━━━━ */
.s1 { background: radial-gradient(ellipse 780px 580px at 12% 58%, rgba(255,156,26,.18) 0%, var(--bg) 62%); }
.s2 { background: radial-gradient(ellipse 880px 480px at 88% 28%, rgba(255,156,26,.14) 0%, #060a12 68%); }
.s3 { background: radial-gradient(ellipse 680px 560px at 50% 82%, rgba(31,41,55,.48) 0%, #080b14 68%); }
.s4 { background: radial-gradient(ellipse 780px 480px at 22% 18%, rgba(255,156,26,.10) 0%, #0a0e16 68%); }
.s5 { background: radial-gradient(ellipse 680px 480px at 78% 68%, rgba(255,156,26,.09) 0%, #060910 68%); }
.s6 { background: radial-gradient(ellipse 780px 580px at 50% 32%, rgba(255,156,26,.22) 0%, #07080e 62%); }
.s7 { background: radial-gradient(ellipse 680px 480px at 38% 62%, rgba(31,41,55,.42) 0%, #070a12 68%); }
.s8  { background: radial-gradient(ellipse 760px 520px at 50% 22%, rgba(255,156,26,.12) 0%, #060910 66%); }
/* .s9 (examples) merged into .s8, .s11 (integrity) merged into .s12 */
.s10 { background: radial-gradient(ellipse 700px 520px at 20% 30%, rgba(0,209,143,.07) 0%, #070a12 68%); }
.s12 { background: radial-gradient(ellipse 760px 540px at 30% 70%, rgba(31,41,55,.42) 0%, #080b13 68%); }
.s13 { background: radial-gradient(ellipse 780px 520px at 60% 28%, rgba(255,156,26,.13) 0%, #0a0e16 66%); }
.s14 { background: radial-gradient(ellipse 820px 560px at 50% 40%, rgba(255,156,26,.18) 0%, #070a12 66%); }
/* Every .slide now carries overflow-y:auto (see the .slide rule), so the old
   per-slide list is redundant. Safe only because .deco keeps the decorative
   blobs out of the scrollable area — otherwise this would put a scrollbar on
   every slide at every window size. */

/* COOKIE CONSENT */
.cookie-banner {
  position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 10000;
  display: none; align-items: center; justify-content: space-between; gap: 12px;
  max-width: 860px; margin: 0 auto; padding: 12px 14px; border-radius: 16px;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(7,10,18,.92); backdrop-filter: blur(14px);
  box-shadow: 0 18px 50px rgba(0,0,0,.42);
}
.cookie-banner.show { display: flex; }
.cookie-banner p { color: var(--muted); font-size: 13px; line-height: 1.55; }
.cookie-banner a { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
.cookie-actions { display: flex; gap: 8px; flex-shrink: 0; }
.cookie-actions .btn { padding: 9px 12px; font-size: 12px; }

/* ━━━━━━━━━━━━━━━ TF TABS (NUMBERS SLIDE) ━━━━━━━━━━━━━━━ */
.tf-tabs {
  display: inline-flex; gap: 4px; padding: 4px;
  border-radius: 999px; border: 1px solid var(--line);
  background: rgba(255,255,255,.04);
  position: relative; z-index: 10;
}
.tf-tab {
  padding: 7px 18px; border-radius: 999px;
  border: 1px solid transparent; background: transparent;
  color: var(--muted); font-size: 12px; font-weight: 800;
  letter-spacing: .06em; cursor: pointer; pointer-events: auto;
  transition: background .14s, color .14s, border-color .14s;
}
.tf-tab:hover { color: var(--text); background: rgba(255,255,255,.05); }
.tf-tab.act {
  color: #1a0f00;
  background: linear-gradient(90deg, var(--gold), var(--gold2));
  border-color: rgba(255,156,26,.7);
  box-shadow: 0 6px 18px rgba(255,156,26,.2);
}

/* ━━━━━━━━━━━━━━━ SCROLL TO TOP ━━━━━━━━━━━━━━━ */
#toTop {
  position: fixed; right: 14px; bottom: 20px; z-index: 120;
  width: 38px; height: 38px; border-radius: 12px; padding: 0;
  display: grid; place-items: center;
  border: 1px solid var(--line); background: rgba(7,10,18,.7);
  backdrop-filter: blur(10px); color: var(--muted2);
  font-size: 16px; cursor: pointer;
  opacity: 0; pointer-events: none; transform: translateY(6px);
  transition: opacity .2s, transform .2s, background .18s, border-color .18s;
}
#toTop.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
#toTop:hover { background: rgba(255,255,255,.08); border-color: rgba(255,156,26,.32); color: var(--text); }

/* ━━━━━━━━━━━━━━━ PROGRESS BAR ━━━━━━━━━━━━━━━ */
#prog {
  position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 200;
  background: linear-gradient(90deg, var(--gold), var(--gold2));
  pointer-events: none; transition: width .1s linear;
}

/* ━━━━━━━━━━━━━━━ TOP NAV ━━━━━━━━━━━━━━━ */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 150;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: var(--nav-h);
  background: linear-gradient(180deg, rgba(6,9,16,.88) 0%, rgba(6,9,16,.45) 100%);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(16px);
  gap: 12px;
}
.topnav-brand img { height: 28px; display: block; }
.topnav-center {
  display: flex; align-items: center; gap: 2px;
  overflow-x: auto; scrollbar-width: none;
}
.topnav-center::-webkit-scrollbar { display: none; }
.nav-btn {
  background: none; border: 1px solid transparent; border-radius: 9px;
  color: var(--muted); font-size: 12px; font-weight: 700;
  padding: 5px 9px; cursor: pointer; white-space: nowrap;
  transition: color .14s, background .14s, border-color .14s;
}
.nav-btn:hover { color: var(--text); background: rgba(255,255,255,.06); }
.nav-btn.act {
  color: var(--text); border-color: rgba(255,156,26,.32); background: rgba(255,156,26,.1);
}
.topnav-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.lang-btn {
  background: none; border: 1px solid var(--line); border-radius: 9px;
  color: var(--muted); font-size: 12px; font-weight: 900;
  padding: 5px 10px; cursor: pointer; letter-spacing: .04em;
  transition: color .14s, background .14s, border-color .14s;
}
.lang-btn:hover { color: var(--text); background: rgba(255,255,255,.06); }
.lang-btn.act {
  color: var(--gold); border-color: rgba(255,156,26,.42); background: rgba(255,156,26,.1);
}
.burger-btn {
  display: none; background: none; border: 1px solid var(--line);
  border-radius: 10px; color: var(--text); width: 36px; height: 36px;
  place-items: center; cursor: pointer; font-size: 16px;
}

/* ━━━━━━━━━━━━━━━ MOBILE DRAWER ━━━━━━━━━━━━━━━ */
#drawer {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,.55); backdrop-filter: blur(8px);
  display: none;
}
#drawer.open { display: block; }
.drawer-panel {
  position: absolute; right: 0; top: 0; bottom: 0;
  width: min(320px, 90vw);
  background: linear-gradient(180deg, rgba(7,10,18,.98) 0%, rgba(10,14,24,.98) 100%);
  border-left: 1px solid var(--line);
  box-shadow: -20px 0 60px rgba(0,0,0,.6);
  display: flex; flex-direction: column; padding: 16px;
  gap: 12px; overflow-y: auto;
}
.drawer-head {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 12px; border-bottom: 1px solid var(--line);
}
.drawer-head img { height: 26px; }
.drawer-close {
  background: none; border: 1px solid var(--line); border-radius: 10px;
  color: var(--text); width: 34px; height: 34px;
  display: grid; place-items: center; cursor: pointer; font-size: 16px;
}
.drawer-lang { display: flex; gap: 8px; }
.drawer-lang .lang-btn { flex: 1; justify-content: center; text-align: center; }
.drawer-nav {
  display: flex; flex-direction: column; gap: 4px;
  border: 1px solid var(--line); border-radius: var(--r);
  padding: 8px; background: rgba(255,255,255,.03);
}
.drawer-nav .nav-btn {
  width: 100%; text-align: left; padding: 10px 12px;
  border-radius: 10px; font-size: 14px;
}
/* The drawer mirrors the grouped top nav but keeps every slide reachable:
   the group head is the jump target, sub-items address the slides inside it. */
.drawer-group { display: flex; flex-direction: column; gap: 2px; }
.drawer-group + .drawer-group { margin-top: 4px; }
.drawer-nav .nav-sub {
  padding: 7px 12px 7px 24px; font-size: 12.5px;
  color: var(--muted2); position: relative;
}
.drawer-nav .nav-sub::before {
  content: ''; position: absolute; left: 13px; top: 50%;
  width: 4px; height: 4px; border-radius: 50%;
  background: currentColor; opacity: .55; transform: translateY(-50%);
}
.drawer-cta { display: flex; flex-direction: column; gap: 8px; }
.drawer-foot { margin-top: auto; font-size: 11px; color: var(--muted2); line-height: 1.5; }

/* ━━━━━━━━━━━━━━━ NAV DOTS ━━━━━━━━━━━━━━━ */
#dots {
  position: fixed; right: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 12px; z-index: 120;
}
.dot {
  position: relative; width: 8px; height: 8px;
  border-radius: 50%; padding: 0; border: none; cursor: pointer;
  background: rgba(255,255,255,.2);
  transition: background .22s, transform .22s;
}
.dot::after {
  content: attr(aria-label);
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  background: rgba(7,10,18,.9); color: rgba(255,255,255,.82);
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line);
  white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity .18s;
}
.dot:hover::after { opacity: 1; }
.dot.a { background: var(--gold); transform: scale(1.7); }
.dot:hover:not(.a) { background: rgba(255,255,255,.5); }

/* ━━━━━━━━━━━━━━━ SLIDE COUNTER ━━━━━━━━━━━━━━━ */

  position: fixed; left: 16px; bottom: 20px; z-index: 120;
  font-size: 11px; font-weight: 900; letter-spacing: .1em;
  color: var(--muted2);
}

/* ━━━━━━━━━━━━━━━ SCROLL CUE ━━━━━━━━━━━━━━━ */
.scroll-cue {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  color: var(--muted2); font-size: 10px; font-weight: 800;
  letter-spacing: .16em; text-transform: uppercase;
  animation: cueFloat 2.4s ease-in-out infinite; z-index: 3;
}
@keyframes cueFloat {
  0%,100% { transform: translateX(-50%) translateY(0);   opacity: .6; }
  50%      { transform: translateX(-50%) translateY(6px); opacity: 1; }
}

/* ━━━━━━━━━━━━━━━ LIGHTBOX ━━━━━━━━━━━━━━━ */
#lbox {
  position: fixed; inset: 0; background: rgba(0,0,0,.78);
  display: none; align-items: center; justify-content: center;
  padding: 24px; z-index: 9999;
}
#lbox.open { display: flex; }
#lbox img { max-width: min(1200px,96vw); max-height: 90vh; border-radius: 14px; object-fit: contain; }
#lboxClose {
  position: absolute; top: 16px; right: 16px;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
  border-radius: 12px; color: #fff; width: 40px; height: 40px;
  display: grid; place-items: center; cursor: pointer; font-size: 18px; font-weight: 900;
}

/* ━━━━━━━━━━━━━━━ RESPONSIVE ━━━━━━━━━━━━━━━ */
@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-right { display: none; }
  .hero-left { text-align: center; }
  .hero-left .btn-row { justify-content: center; }
  .trust-strip { justify-content: center; }
  .pricing-wrap { grid-template-columns: 1fr; }
  .payment-wrap { grid-template-columns: 1fr; }
  .plan-card { width: 100%; max-width: 420px; margin: 0 auto; }
  .pricing-left { text-align: center; }
  .payment-copy { text-align: center; }

  .payment-copy .sub { margin-left: auto; margin-right: auto; }
  .pricing-chip-row { justify-content: center; }
}
@media (max-width: 760px) {
  .topnav-center { display: none; }
  .burger-btn { display: grid; }
  .feat-grid  { grid-template-columns: 1fr 1fr; }
  .steps-grid { grid-template-columns: 1fr 1fr; }

  .review-grid .review-card:nth-child(n+5) { display: none; }

  .gallery {

  .cookie-banner { align-items: stretch; flex-direction: column; }
  .cookie-actions { justify-content: flex-end; }
  #dots { right: 6px; }
  .dot::after { display: none; }
}
@media (max-width: 480px) {

@media (prefers-reduced-motion: reduce) {

/* ═══════════════════════════════════════════
   BOOTSTRAP
═══════════════════════════════════════════ */
const wrap    = document.getElementById('wrap');
const prog    = document.getElementById('prog');
const dotsEl  = document.getElementById('dots');
const lbox    = document.getElementById('lbox');
const lboxImg = document.getElementById('lboxImg');
const drawer  = document.getElementById('drawer');
const slides  = Array.from(document.querySelectorAll('.slide'));
const N       = slides.length;

// ── Build nav dots ──
slides.forEach((s, i) => {
  const d = document.createElement('button');
  d.className = 'dot';
  d.dataset.i = i;
  dotsEl.appendChild(d);
});
const dots = Array.from(dotsEl.querySelectorAll('.dot'));

/* ── Build top nav + drawer nav ──
   The nav used to be 1:1 with slides, which meant 14 buttons overflowing the
   top bar. Slides are now grouped: the top bar shows one button per group and
   jumps to the group's first slide, staying active for every slide in it. The
   drawer keeps the full list as sub-items so mobile can still reach any slide
   directly. Group order must follow DOM slide order. */
const NAV_GROUPS = [
  { key: 'nav.home',     slides: ['nav.home'] },
  { key: 'navg.results', slides: ['nav.numbers', 'nav.demo'] },
  { key: 'navg.system',  slides: ['nav.process', 'nav.features', 'nav.fit'] },
  { key: 'navg.trust',   slides: ['nav.faq'] },
  { key: 'nav.guides',   slides: ['nav.guides'] },
  { key: 'navg.pay',     slides: ['nav.pricing', 'nav.payment'] },
  { key: 'nav.support',  slides: ['nav.support'] },
];

const slideIndexOf = key => slides.findIndex(s => s.dataset.labelKey === key);

const navGroups = NAV_GROUPS
  .map(g => ({ key: g.key, idxs: g.slides.map(slideIndexOf).filter(i => i >= 0) }))
  .filter(g => g.idxs.length);

// Any slide missing from NAV_GROUPS would be unreachable from the nav — keep it
// addressable by appending it as its own group rather than dropping it silently.
slides.forEach((s, i) => {
  if (navGroups.some(g => g.idxs.includes(i))) return;
  navGroups.push({ key: s.dataset.labelKey, idxs: [i] });
});

const navLinksEl = document.getElementById('navLinks');
const drawerNav  = document.getElementById('drawerNav');

navGroups.forEach(g => {
  const top = document.createElement('button');
  top.className = 'nav-btn';
  top.dataset.i = g.idxs[0];
  navLinksEl.appendChild(top);
  g.topBtn = top;

  const row = document.createElement('div');
  row.className = 'drawer-group';

  const head = document.createElement('button');
  head.className = 'nav-btn';
  head.dataset.i = g.idxs[0];
  row.appendChild(head);
  g.drawerBtn = head;

  // Only groups that actually bundle slides need sub-items.
  g.subBtns = g.idxs.length > 1 ? g.idxs.map(i => {
    const sub = document.createElement('button');
    sub.className = 'nav-btn nav-sub';
    sub.dataset.i = i;
    sub.dataset.labelKey = slides[i].dataset.labelKey;
    row.appendChild(sub);
    return sub;
  }) : [];

  drawerNav.appendChild(row);
});

const drawerBtns = navGroups.flatMap(g => [g.drawerBtn, ...g.subBtns]);

/* ═══════════════════════════════════════════
   i18n
═══════════════════════════════════════════ */
let lang = localStorage.getItem('ksp_lang') || (navigator.language.startsWith('mn') ? 'mn' : 'en');

function applyLang(l) {
  lang = l;
  localStorage.setItem('ksp_lang', l);
  document.documentElement.lang = l;

  document.querySelectorAll('[data-t]').forEach(el => {
    const v = T[l][el.dataset.t];
    if (v !== undefined) el.innerHTML = v;
  });

  // Dot tooltips stay per-slide; nav buttons are per-group.
  slides.forEach((s, i) => {
    dots[i].setAttribute('aria-label', T[l][s.dataset.labelKey] || s.dataset.labelKey);
  });
  navGroups.forEach(g => {
    const label = T[l][g.key] || g.key;
    g.topBtn.textContent    = label;
    g.drawerBtn.textContent = label;
    g.subBtns.forEach(b => {
      b.textContent = T[l][b.dataset.labelKey] || b.dataset.labelKey;
    });
  });

  // Lang button active states (all lang buttons: topnav + drawer)
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('act', b.dataset.lang === l));
}

// Wire language buttons
document.querySelectorAll('.lang-btn').forEach(b => {
  b.addEventListener('click', () => { applyLang(b.dataset.lang); syncTgLinks(); });
});

applyLang(lang);

/* ═══════════════════════════════════════════
   COUNTER ANIMATION
═══════════════════════════════════════════ */
function countUp(el, target, dec) {
  const dur = 1400, t0 = performance.now();
  function step(now) {
    const p = Math.min((now - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = dec
      ? (target * e).toFixed(dec)
      : Math.round(target * e).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ═══════════════════════════════════════════
   SLIDE TRIGGER (reveal + countup)
═══════════════════════════════════════════ */
function triggerSlide(section) {
  section.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
  section.querySelectorAll('[data-target]').forEach(el => {
    if (el.dataset.counted) return;
    el.dataset.counted = '1';
    countUp(el, parseFloat(el.dataset.target), el.dataset.dec ? +el.dataset.dec : 0);
  });
}

// IntersectionObserver
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting && !e.target.dataset.done) {
      e.target.dataset.done = '1';
      triggerSlide(e.target);
    }
  });
}, { root: wrap, threshold: 0.38 });
slides.forEach(s => io.observe(s));
triggerSlide(slides[0]);

/* ═══════════════════════════════════════════
   SCROLL STATE
═══════════════════════════════════════════ */
const slideNum = document.getElementById('slideNum');

function onScroll() {
  const st = wrap.scrollTop;
  const sh = wrap.scrollHeight - wrap.clientHeight;
  prog.style.width = (sh > 0 ? (st / sh) * 100 : 0) + '%';

  const idx = Math.round(st / wrap.clientHeight);
  dots.forEach((d, i) => d.classList.toggle('a', i === idx));
  navGroups.forEach(g => {
    const on = g.idxs.includes(idx);
    g.topBtn.classList.toggle('act', on);
    g.drawerBtn.classList.toggle('act', on);
    g.subBtns.forEach(b => b.classList.toggle('act', +b.dataset.i === idx));
  });
  slideNum.textContent = `${idx + 1} / ${N}`;
}
wrap.addEventListener('scroll', onScroll, { passive: true });
onScroll();

/* ═══════════════════════════════════════════
   DOT / NAV CLICK
═══════════════════════════════════════════ */
function scrollTo(i) {
  wrap.scrollTo({ top: i * wrap.clientHeight, behavior: 'smooth' });
}
dots.forEach(d => d.addEventListener('click', () => scrollTo(+d.dataset.i)));
navGroups.forEach(g => g.topBtn.addEventListener('click', () => scrollTo(+g.topBtn.dataset.i)));
drawerBtns.forEach(b => b.addEventListener('click', () => { scrollTo(+b.dataset.i); closeDrawer(); }));
document.querySelectorAll('[data-jump]').forEach(el => {
  el.addEventListener('click', e => {
    const key = el.dataset.jump;
    const idx = slides.findIndex(s => s.dataset.labelKey === key);
    if (idx < 0) return;
    e.preventDefault();
    scrollTo(idx);
  });
});

/* ═══════════════════════════════════════════
   KEYBOARD NAVIGATION
═══════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  const cur = Math.round(wrap.scrollTop / wrap.clientHeight);
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); scrollTo(cur + 1); }
  if (e.key === 'ArrowUp'   || e.key === 'PageUp')   { e.preventDefault(); scrollTo(cur - 1); }
  if (e.key === 'Escape') { closeLbox(); closeDrawer(); }
});

/* ═══════════════════════════════════════════
   MOBILE DRAWER
═══════════════════════════════════════════ */
function openDrawer()  { drawer.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeDrawer() { drawer.classList.remove('open'); document.body.style.overflow = ''; }

document.getElementById('burgerBtn').addEventListener('click', openDrawer);
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
drawer.addEventListener('click', e => { if (e.target === drawer) closeDrawer(); });

/* ═══════════════════════════════════════════
   LIGHTBOX
═══════════════════════════════════════════ */
function closeLbox() { lbox.classList.remove('open'); lboxImg.src = ''; }
document.querySelectorAll('[data-lbox]').forEach(el => {
  el.addEventListener('click', () => {
    lboxImg.src = el.dataset.lbox;
    lboxImg.alt = el.dataset.alt || '';
    lbox.classList.add('open');
  });
});
document.getElementById('lboxClose').addEventListener('click', closeLbox);
lbox.addEventListener('click', e => { if (e.target === lbox) closeLbox(); });

/* ═══════════════════════════════════════════
   DEMO VIDEO
═══════════════════════════════════════════ */
const videoCard = document.getElementById('videoCard');
const demoVideo = document.getElementById('demoVideo');
const videoBtn  = document.getElementById('videoPlayBtn');
if (videoBtn) {
  videoBtn.addEventListener('click', () => {
    videoCard.classList.add('playing');
    demoVideo.play();
  });
  demoVideo.addEventListener('pause', () => videoCard.classList.remove('playing'));
  demoVideo.addEventListener('ended', () => videoCard.classList.remove('playing'));
}

/* ── Demo tabs: video / chart examples ── */
(function initDemoTabs() {
  const tabs  = Array.from(document.querySelectorAll('.demo-tab'));
  if (!tabs.length) return;
  const panes = {
    video: document.getElementById('demoPaneVideo'),
    shots: document.getElementById('demoPaneShots'),
  };

  // loading="lazy" never fires inside a display:none pane, so the first tap on
  // Charts would show empty frames. Warm them once the slide comes into view.
  const shotsPane = panes.shots;
  if (shotsPane) {
    const warm = new IntersectionObserver(entries => {
      if (!entries.some(e => e.isIntersecting)) return;
      shotsPane.querySelectorAll('img[loading="lazy"]').forEach(img => {
        const pre = new Image();
        pre.src = img.currentSrc || img.src;
      });
      warm.disconnect();
    }, { root: wrap, threshold: 0.2 });
    warm.observe(shotsPane.closest('.slide'));
  }
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const which = tab.dataset.demo;
      tabs.forEach(t => {
        const on = t === tab;
        t.classList.toggle('act', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      Object.entries(panes).forEach(([k, pane]) => {
        pane?.classList.toggle('act', k === which);
      });
      // Leaving the video pane shouldn't leave audio/CPU running behind a hidden pane.
      if (which !== 'video' && demoVideo && !demoVideo.paused) demoVideo.pause();
    });
  });
})();

/* ═══════════════════════════════════════════
   PAYMENT + COOKIE CONSENT
═══════════════════════════════════════════ */
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return true;
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

const copyWalletBtn = document.getElementById('copyWallet');
const usdtWalletEl = document.getElementById('usdtWallet');
copyWalletBtn?.addEventListener('click', async () => {
  const address = (usdtWalletEl?.textContent || '').trim();
  if (!address) return;
  const ok = await copyText(address);
  if (!ok) return;
  const dict = T[lang] || T.en;
  copyWalletBtn.innerHTML = dict['usdt.copied'] || 'Copied';
  window.setTimeout(() => {
    copyWalletBtn.innerHTML = dict['usdt.copy'] || 'Copy address';
  }, 1300);
});

(function initCookieConsent() {
  const KEY = 'khan_cookie_consent';
  const banner = document.getElementById('cookieBanner');
  const accept = document.getElementById('cookieAccept');
  const reject = document.getElementById('cookieReject');
  const stored = localStorage.getItem(KEY);
  if (!stored) banner?.classList.add('show');
  accept?.addEventListener('click', () => {
    localStorage.setItem(KEY, 'granted');
    banner?.classList.remove('show');
  });
  reject?.addEventListener('click', () => {
    localStorage.setItem(KEY, 'denied');
    banner?.classList.remove('show');
  });
})();

/* ═══════════════════════════════════════════
   SCROLL TO TOP
═══════════════════════════════════════════ */
(function () {
  const btn = document.getElementById('toTop');
  if (!btn) return;
  const scroller = document.getElementById('wrap') || window;
  function onScroll() {
    const y = scroller === window ? window.scrollY : scroller.scrollTop;
    btn.classList.toggle('show', y > 300);
  }
  scroller.addEventListener('scroll', onScroll, { passive: true });
  btn.addEventListener('click', () => {
    if (scroller === window) window.scrollTo({ top: 0, behavior: 'smooth' });
    else scroller.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
